<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Onam Pookalam Quiz</title>
  <!-- ?v= is a manual cache key. Slate serves assets with max-age=31536000 (a
       year), and there is no build step to fingerprint filenames, so bump this
       number on every deploy or returning devices keep the old app. -->
  <link rel="stylesheet" href="styles.css?v=11">
</head>
<body>
  <main class="stage">
    <div class="kasavu" aria-hidden="true"></div>

    <div id="progress" class="progress" hidden></div>

    <svg id="kalam" class="kalam" viewBox="0 0 240 240"
         role="img" aria-label="Your pookalam, growing one ring per answer"></svg>

    <section id="panel" class="panel"></section>
  </main>

  <!-- Plain scripts, loaded in dependency order. No modules (so file:// works),
       no external libraries, no CDN. -->
  <script src="js/questions.js?v=11"></script>
  <script src="js/pookalam.js?v=11"></script>
  <script src="js/api.js?v=11"></script>
  <script src="js/live.js?v=11"></script>
  <script src="js/app.js?v=11"></script>
</body>
</html>
