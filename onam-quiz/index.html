<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Onam Pookalam Quiz</title>
  <!-- Keep asset versions aligned when deploying through an intermediary cache. -->
  <!-- Type stack per DESIGN.md: Fraunces (display), Anek Malayalam (UI/body,
       Latin + Malayalam as one family), IBM Plex Sans Condensed (scores,
       timers, room codes — tabular), Chilanka (flourish, one use per screen). -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..900,0..100,0..1;1,9..144,300..900,0..100,0..1&family=Anek+Malayalam:wght@300..700&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=Chilanka&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=28">

  <!-- Warm the two reaction images. Nothing references them until the first
       answer is scored, so without a hint the reaction slot sits empty while
       the file downloads mid-quiz. As WebP they are ~82KB for the pair.

       prefetch, not preload: the player has to read this screen, press start
       and read a question first, so these are never needed "now". preload
       promises immediate use and Chrome logs an unused-resource warning on
       every session when that promise is not kept; prefetch is the hint that
       actually means likely-needed-soon, and it fetches at idle priority so
       it does not compete with the CSS and JS above.

       type= gates the hint, so browsers without WebP skip it and load the
       PNG fallback on demand. -->
  <link rel="prefetch" as="image" type="image/webp" href="img/maveli-happy.webp?v=21">
  <link rel="prefetch" as="image" type="image/webp" href="img/maveli-sigh.webp?v=21">
</head>
<body>
  <main class="stage">
    <div class="kasavu" aria-hidden="true"></div>

    <div id="progress" class="progress" hidden></div>

    <section id="panel" class="panel"></section>
  </main>

  <!-- The Firebase compat SDK keeps this no-build static site in classic script
       mode. `firebase-config.js` contains the project-specific web config. -->
  <script src="js/questions.js?v=21"></script>
  <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-database-compat.js"></script>
  <script src="js/firebase-config.js?v=1"></script>
  <script src="js/api.js?v=21"></script>
  <script src="js/live.js?v=22"></script>
  <script src="js/app.js?v=22"></script>
</body>
</html>
