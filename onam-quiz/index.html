<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Onam Pookalam Quiz</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="stage">
    <div class="kasavu" aria-hidden="true"></div>

    <div id="progress" class="progress" hidden></div>

    <svg id="kalam" class="kalam" viewBox="0 0 240 240"
         role="img" aria-label="Your pookalam, growing one ring per answer"></svg>

    <section id="panel" class="panel"></section>
  </main>

  <!-- Plain scripts, loaded in dependency order. No modules (so file:// works),
       no external libraries, no CDN. -->
  <script src="js/questions.js"></script>
  <script src="js/pookalam.js"></script>
  <script src="js/leaderboard.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
